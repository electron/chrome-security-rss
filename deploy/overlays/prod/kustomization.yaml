# The `deploy_path` in the app's electron/infra ionic-platform-apps entry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: server
    count: 1
patches:
  - target:
      kind: HTTPRoute
      name: server
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: chrome-security-rss.electronjs.org
  - target:
      kind: Deployment
      name: server
    patch: |-
      # The app has no secrets (`secrets = {}` in infra), so no server-secrets
      # ExternalSecret is created. Without this the pod would sit in
      # CreateContainerConfigError waiting for it.
      - op: add
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/optional
        value: true
  - target:
      kind: Deployment
      name: server
    patch: |-
      # electron/infra runs an egress allowlist for this app (`egress_proxy`
      # in terraform/global/ionic-platform-apps): its own DNS resolver, which
      # answers only the allowed hostnames (with the egress proxy's address)
      # and cluster.local, and the proxy, which allows only the feed fetch in
      # server.js. The pod cannot reach kube-dns or the internet directly, and
      # admission rejects pods in this namespace without this dnsConfig. The
      # allowed hostnames live only in infra; nothing here names them.
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: None
      - op: add
        path: /spec/template/spec/dnsConfig
        value:
          nameservers:
            - 10.0.0.201
          searches:
            - chrome-security-rss.svc.cluster.local
            - svc.cluster.local
            - cluster.local
          options:
            - name: ndots
              value: "5"
      # The proxy presents a self-signed certificate per allowed hostname;
      # infra syncs the public certificates (no keys) into this Secret.
      # Node reads the bundle at startup, so a rotated certificate needs a
      # restart (electron/infra modules/ionic-app README, "Rotating a
      # certificate").
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: egress-proxy-trust
          secret:
            secretName: egress-proxy-trust
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: egress-proxy-trust
          mountPath: /etc/egress-proxy
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_EXTRA_CA_CERTS
          value: /etc/egress-proxy/ca.crt
